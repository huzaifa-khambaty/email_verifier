# Install to /etc/nginx/sites-available/email-verifier, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Verify the PHP-FPM socket path matches the VPS's actual pool config
# (check /etc/php/8.3/fpm/pool.d/www.conf's `listen =` line) before
# relying on this as-is.
#
# v2 §11: "Nginx serves Vue frontend, proxies /api to Laravel." /sanctum
# needs the same treatment as /api since Sanctum's CSRF-cookie and
# session endpoints live there too.
#
# Flat deploy layout (see ../remote-deploy.sh): /var/www/email-verifier/
# backend/ and frontend/ are overwritten in place each deploy, no
# releases/current symlink.
#
# The PHP handler is a NAMED location (@backend), not nested inside the
# /api/ and /sanctum/ blocks — found live in production that nesting it
# breaks: try_files's fallback to /index.php is an internal redirect that
# re-runs Nginx's location matching from the top of the server block, not
# scoped to the parent location. /index.php matches neither ^~ /api/ nor
# ^~ /sanctum/, so it fell through to the SPA's `location /` and served
# index.html instead of hitting Laravel. A named location is jumped to
# directly, bypassing that re-match entirely.

server {
    listen 80;
    listen [::]:80;
    server_name nextmatchmail.com www.nextmatchmail.com;

    location ^~ /api/ {
        root /var/www/email-verifier/backend/public;
        try_files $uri @backend;
    }

    location ^~ /sanctum/ {
        root /var/www/email-verifier/backend/public;
        try_files $uri @backend;
    }

    location @backend {
        root /var/www/email-verifier/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    }

    # Everything else: the Vue SPA's built static files.
    root /var/www/email-verifier/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed Vite build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 512M; # matches StoreImportBatchRequest's CSV upload limit
}

# Once DNS + TLS are set up: `sudo certbot --nginx -d nextmatchmail.com -d www.nextmatchmail.com`
# adds the corresponding `listen 443 ssl` server block automatically.
