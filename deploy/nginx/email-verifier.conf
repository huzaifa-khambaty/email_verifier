# Install to /etc/nginx/sites-available/email-verifier, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Verify the PHP-FPM socket path matches the VPS's actual pool config
# (check /etc/php/8.3/fpm/pool.d/www.conf's `listen =` line) before
# relying on this as-is.
#
# v2 §11: "Nginx serves Vue frontend, proxies /api to Laravel." /sanctum
# needs the same treatment as /api since Sanctum's CSRF-cookie and
# session endpoints live there too.

server {
    listen 80;
    listen [::]:80;
    server_name nextmatchmail.com www.nextmatchmail.com;

    # Laravel API — nested php block keeps the fastcgi handling scoped to
    # just these two prefixes rather than every .php request site-wide.
    location ^~ /api/ {
        root /var/www/email-verifier/current/backend/public;
        try_files $uri /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }

    location ^~ /sanctum/ {
        root /var/www/email-verifier/current/backend/public;
        try_files $uri /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }

    # Everything else: the Vue SPA's built static files.
    root /var/www/email-verifier/current/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed Vite build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 512M; # matches StoreImportBatchRequest's CSV upload limit
}

# Once DNS + TLS are set up: `sudo certbot --nginx -d nextmatchmail.com -d www.nextmatchmail.com`
# adds the corresponding `listen 443 ssl` server block automatically.
