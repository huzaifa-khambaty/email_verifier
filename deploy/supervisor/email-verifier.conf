; Install to /etc/supervisor/conf.d/email-verifier.conf on the VPS, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start email-verifier:*
;
; remote-deploy.sh restarts these on every deploy via
; `supervisorctl restart email-verifier:*` (the [group] below is what
; makes that wildcard cover both programs).

[program:email-verifier-worker]
; The DB-polling verification workers (DECISIONS.md "Queue driver — no
; Redis, no broker"). numprocs IS the global concurrency cap — see
; DECISIONS.md "Process model". Tune to the VPS's capacity.
process_name=%(program_name)s_%(process_num)02d
numprocs=10
command=/usr/bin/php /var/www/email-verifier/current/backend/artisan verify:work --name=verify-work-%(process_num)02d
directory=/var/www/email-verifier/current/backend
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/www/email-verifier/shared/backend/storage/logs/worker-%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:email-verifier-queue]
; Laravel's ordinary `database` queue driver, used only for one-shot
; background tasks like CSV import processing — see DECISIONS.md "Queue
; driver — no Redis, no broker" for why this is a separate, smaller pool
; from the verification workers above.
process_name=%(program_name)s_%(process_num)02d
numprocs=2
command=/usr/bin/php /var/www/email-verifier/current/backend/artisan queue:work --sleep=3 --tries=1 --max-time=3600
directory=/var/www/email-verifier/current/backend
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/email-verifier/shared/backend/storage/logs/queue-%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[group:email-verifier]
programs=email-verifier-worker,email-verifier-queue
